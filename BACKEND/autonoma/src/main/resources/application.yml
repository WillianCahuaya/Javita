spring:
  application:
    name: autonoma

  datasource:
    url: jdbc:mariadb://127.0.0.1:3366/mydb
    username: admin
    password: admin
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true