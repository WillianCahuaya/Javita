<div class="d-flex justify-content-center align-items-center vh-100 bg-light">
  <div class="card p-4 shadow-sm" style="width: 25rem;">
    <div class="card-body">
      <h2 class="card-title text-center mb-4">Registro de Usuario</h2>
      <form (ngSubmit)="onSubmitRegistro()" #registroForm="ngForm" novalidate>
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre</label>
          <input type="text" id="nombre" class="form-control" name="nombre" ngModel required #nombre="ngModel">
          <div class="text-danger mt-1" *ngIf="nombre.invalid && nombre.touched">
            ⚠ El nombre es obligatorio.
          </div>
        </div>

        <div class="mb-3">
          <label for="correo" class="form-label">Correo</label>
          <input type="email" id="correo" class="form-control" name="correo" ngModel required email #correo="ngModel">
          <div class="text-danger mt-1" *ngIf="correo.invalid && correo.touched">
            ⚠ Ingrese un correo válido.
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100" [disabled]="registroForm.invalid">
          Registrar
        </button>
      </form>
    </div>
  </div>
</div>
