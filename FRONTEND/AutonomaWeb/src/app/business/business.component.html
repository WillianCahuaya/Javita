<div>
    <nav class="navbar navbar-expand-md navbar-dark bg-gray-950 h-14">

        <div class="container mx-auto flex justify-between items-center">
    
            <button class="navbar-toggler ml-1 mb-2 mt-1" type="button" data-toggle="collapse"
                data-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false"
                aria-label="Toggle navigation" (click)="showNavBar=!showNavBar">
                <span class="navbar-toggler-icon"></span>
            </button>
    
            <div class="form-inline btn-main bg-gray-950 hover:bg-gray-800 text-white">
                <a class="navbar-brandpx-2" [routerLinkActive]="['active']" [routerLink]="['./', 'home']">
                    <i class="fa fa-coffee fa-lg text-white">
                        {{ title }}
                    </i>
                </a>
            </div>
    
            <div class="collapse navbar-collapse navbar-option" id="navbarCollapse" [ngClass]="{ 'show': showNavBar }">
    
                <ul class="navbar-nav me-auto mb-lg-0">
    
                    <li ngbDropdown [ngClass]="{ 'active': false }" class="pr-2">
                        
                        <button class="btn btn-menu text-white bg-gray-950"
                            id="template" [routerLinkActive]="['active']" [routerLink]="['./', 'template']">
                            template
                        </button>

                        <button class="btn btn-menu text-white bg-gray-950 hover:bg-gray-500"
                            id="user" [routerLinkActive]="['active']" [routerLink]="['./', 'user']">
                            usuario
                        </button>
    
                    </li>
    
                </ul>
    
            </div>
    
            <div class="form-inline mx-auto flex justify-between pr-2">
                <span class="fa fa-user-circle-o text-white pl-3 pr-3"> {{username}} </span>
                <button class="btn btn-login"
                    (click)="signOut()"> Salir
                </button>
            </div>
    
        </div>
    </nav>
</div>

<div>
    <router-outlet></router-outlet>
</div>
